# Publish to npm on a version tag, using trusted publishing (OIDC).
#
# No NPM_TOKEN. GitHub mints a short-lived OIDC token, npm exchanges it for publish rights it
# grants only to this repo and this workflow file, and the release carries a provenance
# attestation saying which commit and which run built it. That is strictly better than a
# long-lived token in a secret, and npm is retiring the token path for direct publishing
# anyway (bypass-2FA tokens lose it around January 2027).
#
# One-time setup on npmjs.com, otherwise every run here fails at the publish step:
#   Package -> Settings -> Trusted publisher -> GitHub Actions
#     Organization or user: e3o8o
#     Repository:           newsreel
#     Workflow filename:    release.yml
#
# To cut a release:
#   npm version patch|minor|major     # bumps package.json and tags
#   git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # 🔑 the whole point: without this npm has no OIDC token to exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which is newer than what the runner ships.
      - run: npm install -g npm@latest

      # ⚠️ A tag that disagrees with package.json publishes the wrong version under the right
      #    name, and npm will not let you take it back. Cheaper to fail here.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - run: npm ci

      # The suite exercises the white-flash trim against synthetic clips, so it needs ffmpeg
      # and nothing else. Playwright is not installed here: nothing in the tests drives a browser.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm test

      # Fails loudly if the tarball ever loses the packaged visuals again: without them every
      # generated scene 404s on an installed copy, and the package still looks fine on disk.
      - name: The tarball must contain the visuals
        run: |
          npm pack --silent >/dev/null
          COUNT=$(tar tzf newsreel-*.tgz | grep -c '^package/visuals/primitives/.*\.js$')
          echo "$COUNT scene bundles in the tarball"
          [ "$COUNT" -ge 30 ] || { echo "visuals missing from the package"; exit 1; }
          tar tzf newsreel-*.tgz | grep -q '^package/visuals/harness/index.html$' || {
            echo "harness missing from the package"; exit 1; }
          rm -f newsreel-*.tgz

      - run: npm publish
